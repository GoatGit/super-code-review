name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile check
        run: python -m py_compile scripts/check_review.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Self-check the review template is rejected
        run: |
          python scripts/check_review.py --template > /tmp/template.md
          if python scripts/check_review.py /tmp/template.md; then
            echo "template should not pass the gate"
            exit 1
          fi
